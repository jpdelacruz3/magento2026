; ── PHP-FPM pool: www ─────────────────────────────────────────────────────────
[www]
user  = www-data
group = www-data

listen = 0.0.0.0:9000

; Dynamic process management — tune pm.max_children to (RAM - OS overhead) / ~50 MB per worker
pm                      = dynamic
pm.max_children         = 20
pm.start_servers        = 5
pm.min_spare_servers    = 3
pm.max_spare_servers    = 10
pm.max_requests         = 1000

; Logging
access.log             = /proc/self/fd/2
slowlog                = /proc/self/fd/2
request_slowlog_timeout = 10s

; Pass host environment variables into PHP-FPM workers
clear_env = no

; Expose FPM status & ping endpoints (scraped by monitoring)
pm.status_path = /fpm-status
ping.path      = /fpm-ping
